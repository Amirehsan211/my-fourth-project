<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        .row {
            width: 400px;
            height: 400px;
            border: 1px solid red;
            margin: 100px auto;
            position: relative;
            transform: rotate3d(1, 1, 1, -25deg);
            transform-style: preserve-3d;
            animation: anime1 linear infinite 90s;

            >div {
                width: 100%;
                height: 100%;
                background-color: rgba(165, 42, 42, 0.247);
                position: absolute;
                top: 0;
                left: 0;

                &:nth-of-type(1) {
                    transform: translateZ(200px);
                    background-image: url(1.jfif);
                }

                &:nth-of-type(2) {
                    transform: translateZ(-200px);
                    background-image: url(3.jfif);
                }

                &:nth-of-type(3) {
                    transform: translateZ(-200px)rotateY(-90deg);
                    transform-origin: left;
                    background-image: url(4.jfif);
                }

                &:nth-of-type(4) {
                    transform: translateZ(-200px)rotateY(90deg);
                    transform-origin: right;
                    background-image: url(5.jfif);
                }

                &:nth-of-type(5) {
                    transform: translateZ(-200px)rotatex(90deg);
                    transform-origin: top;
                    background-image: url(6.jfif);
                }

                &:nth-of-type(6) {
                    transform: translateZ(-200px)rotatex(-90deg);
                    transform-origin: bottom;
                    background-image: url(images2.jfif);
                }
            }
        }


        .end {
            background-image: linear-gradient(rgb(107, 107, 192), red);
            width: 100%;
            height: 630px;


            >h2 {
                font-size: 40px;
                margin: -70px 650px;

            }

            .div {

                box-shadow: 2px 5px 10px 15px rgba(255, 255, 255, 0.548);
                width: 200px;
                height: 200px;
                border-radius: 50%;
                margin: 100px auto;
                animation-name: anime2;
                animation-iteration-count: 20;
                animation-duration: 5s;
                animation-timing-function: linear;
                animation-iteration-count: 1s;
                animation-delay: 1s;
                animation-direction: alternate;

                >img {
                    width: 200px;
                    height: 200px;
                    border-radius: 50%;
                    object-fit: cover;
                }
            }
        }
        
          .div2 {
           
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(245, 245, 220, 0.608);



            >a {
                color: rgb(0, 0, 0);
            }
        }

        .div3 {
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(255, 228, 196, 0.732);


            >a {
                color: rgb(2, 2, 2);
            }
        }

        .div4 {
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(255, 228, 196, 0.681);


            >a {
                color: rgb(1, 1, 1);
            }
        }

        .back {
            background-color: rgb(96, 90, 90);
        }

        @keyframes anime1 {
            100% {
                transform: rotate3d(1, 1, 1, -2500deg);
            }
        }
    </style>
</head>
